style:

  small-caps: true
  colors:
    positive: "#55FF55"
    neutral: "#FFA500"
    negative: "#FF5555"

    highlight: "#FFFF55"

updater:
  # Fine-grained GitHub token with Contents: Read-only for Vextex123/LifestealCore.
  # Keep this value private; do not publish your server's config.yml.
  github-token: ""

modules:
  manage: true
  chat: true
  ban: false
  team: true
  anticheat: false
  shop: true
  boosters: true
  scoreboard: true
  combat: true
  ranks: true
  moderation: true
  itemedit: true
  bounty: true

economy:
  start-money: 1000
  start-gems: 50

  log-transactions: true

  log-keep-days: 30

shop:

  rows: 3

sell-prices:
  EMERALD:
    currency: gems
    price: 50.0
  DIAMOND_SWORD:
    currency: money
    price: 500.0

sounds:
  success: "entity.player.levelup"
  error: "entity.villager.no"
  sell: "entity.experience_orb.pickup"
  click: "ui.button.click"
  alert: "entity.experience_orb.pickup"

boosters:

  auto-interval-minutes: 120

  duration-minutes: 15

  max-passive: 2

  bossbar: true

  boost-sell: true

  random-tick-normal: 3
  random-tick-boosted: 30

scoreboard:

  update-ticks: 20
  title: "&cʟɪꜰᴇꜱᴛᴇᴀʟꜱᴍᴘ"

  separator-adjust: 0

  lines:
    - "&c&m%separator%"
    - "&fᴘʟᴀʏᴇʀ: &e%player%"
    - "&fʀᴀɴᴋ: %rank%"
    - "&fᴛᴇᴀᴍ: &e%team%"
    - "&fᴍᴏɴᴇʏ: &a$%money%"
    - "&fɢᴇᴍꜱ: &6%gems%"
    - "&fᴋᴏᴛʜ: &e%koth%"
    - "&7"
    - "&fᴋɪʟʟꜱ: &a%kills%"
    - "&fᴅᴇᴀᴛʜꜱ: &4%deaths%"
    - "&fᴘʟᴀʏᴛɪᴍᴇ: &e%playtime_days%ᴅ %playtime_hours%ʜ"
    - "%booster_section%"
    - "&c&m%separator%"

  booster-section:
    - "&8"
    - "&fʙᴏᴏꜱᴛᴇʀ:"
    - "  - %boosters%"

tablist:
  header: "&8[ &6ʟɪꜰᴇꜱᴛᴇᴀʟꜱᴍᴘ &8]\n&6ᴡᴇʟᴄᴏᴍᴇ, &e%player%!"
  footer: "&aᴏɴʟɪɴᴇ: %online% / &c%max_online% &6| ᴘɪɴɢ: %ping%ᴍꜱ"

nametags:
  enabled: true
  format: "&7[&c%health%❤&7] &f"

rank-colors: {}

combat:

  seconds: 20

  return-seconds: 10
  forcefield:

    radius: 3
    vertical: 4

hearts:
  start: 10

  max: 20

  return-hearts: 5

  lose-only-on-pvp: true

  item:
    material: RED_DYE
    texture: ""
    item-model: ""

ban:
  hours: 24

alt-check:
  enabled: true

team-protection:
  enabled: true

protection:

  newbie-seconds: 10800

  low-hearts-threshold: 5
  low-hearts-seconds: 10800

bounty:
  currencies:
    money:
      min-amount: 100

      max-amount: 1000000

      steps: [100, 1000, 10000]
    gems:
      min-amount: 1
      max-amount: 10000
      steps: [1, 10, 100]

  duration-minutes: 1440

  cooldown-seconds: 1800

  max-active-per-player: 3

  extend-duration-on-increase: false
  broadcast-new: true
  broadcast-claim: true
  broadcast-expire: false
  claim:

    tax-percent: 0

    contributors-can-claim: false

    block-same-ip: true

    same-target-cooldown-minutes: 30
    disabled-worlds: []

  refund-percent: 100

chat-input:
  timeout-seconds: 30
  cancel-word: "cancel"

itemedit:

  slot-check-seconds: 1

settings:
  mob-spawning-radius: 32

worldedit:
  max-blocks: 50000

worldguard:
  max-region-blocks: 1000000

chat:
  link-filter: true
  caps-protection: true
  spam:
    fast-window-seconds: 3
    messages: 5
    cooldown-seconds: 5
