name: LifestealCore
version: '${project.version}'
main: de.leon.lifesteal.LifestealCore
api-version: '26.2'
author: leon
description: All-in-one core for the Lifesteal SMP (economy, shop, boosters, scoreboard, combat, hearts, ranks, moderation, item editor, bounties)
softdepend: [LuckPerms, ProtocolLib, ProtocolSupport, ViaVersion, ViaBackwards, ViaRewind, Geyser-Spigot]

provides: [EcoExtension]

commands:
  lag:
    description: Server performance and lag monitor
    usage: /lag [gui|status|refresh]
    permission: Owner.Core
  plugin:
    description: Plugin management dashboard
    usage: /plugin
    permission: Owner.Core
    aliases: [pl, plugins]
  console-error:
    description: Paginated server console warnings and errors
    usage: /console-error
    permission: Owner.Core
  restart:
    description: Save server data and restart using the configured restart script
    usage: /restart
    permission: Owner.Core
  stop:
    description: Save server data and stop the server cleanly
    usage: /stop
    permission: Owner.Core
  lsc:
    description: LifestealCore admin command
    usage: /lsc <reload|save|info>
    permission: Admin.Core
    aliases: [lifestealcore]
  admin:
    description: Central admin dashboard and audit tools
    usage: /admin [logs|check <player>]
  permission:
    description: LuckPerms permission manager
    usage: /permission [group]
    permission: Admin.Core
    aliases: [permissions]
  perm:
    description: Alias for permission manager
    usage: /perm <group> <permission.node> <add|remove>
    permission: Admin.Core
  ranks:
    description: Rank priority editor
    usage: /ranks editor
    permission: Admin.Core
  pay:
    description: Send money or gems to another player
    usage: /pay <money|gems> <player> <amount>
  bal:
    description: Shows the balance of money and gems
    usage: /bal [player]
    aliases: [balance]
  shop:
    description: Opens the shop
    usage: /shop [editor]
  sell:
    description: Opens the sell menu
    usage: /sell
  eco:
    description: Economy administration and account statements
    usage: /eco <money|gems> <give|remove|check> <player> [amount]
    permission: Admin.Core
  booster:
    description: Booster menu
    usage: /booster [gui|give <player> <booster> [amount]]
  sbooster:
    description: Server booster control
    usage: /sbooster skip
    permission: Admin.Core
    aliases: [serverbooster]
  combat:
    description: Puts a player in combat
    usage: /combat <player> <seconds>
    permission: Admin.Core
  protection:
    description: Turn your protection on or off
    usage: /protection [on|off|toggle]
  heart:
    description: Heart tools
    usage: /heart <check [player] | unban <player>>
  rank:
    description: Opens the rank menu for a player
    usage: /rank <editor|player> [player]
    permission: Admin.Core
  gm:
    description: Changes the game mode
    usage: /gm <mode> [player]
    permission: Admin.Core
    aliases: [gamemode, gms, gmc, gmsp, gma]
  tp:
    description: Staff teleport
    usage: /tp <player> [player]
  support:
    description: Toggles support mode
    usage: /support [on|off|toggle]
    permission: Support.Core
  godmode:
    description: Makes you invulnerable
    usage: /godmode [on|off|toggle]
    permission: Mod.Core
  request:
    description: Sends a support request
    usage: /request
    aliases: [rq]
  itemedit:
    description: Edit the item in your hand
    usage: /itemedit
    permission: Admin.Core
    aliases: [it, itemedid]
  bounty:
    description: Opens the bounty menu
    usage: /bounty
    aliases: [bounties]
  stats:
    description: View player statistics or open the admin stats editor
    usage: /stats [player] [editor]
  invsee:
    description: View or edit a player inventory
    usage: /invsee <player>
  endersee:
    description: View or edit a player ender chest
    usage: /endersee <player>
  spawn:
    description: Teleports to spawn or sends a player there
    usage: /spawn [player]
  rtp:
    description: Opens the random teleport dimension menu
    usage: /rtp
    aliases: [randomteleport]
  tpa:
    description: Request to teleport to another player
    usage: /tpa [player]
  tpahere:
    description: Request another player to teleport to you
    usage: /tpahere [player]
  tpaccept:
    description: Accept a teleport request or open incoming requests
    usage: /tpaccept [player]
  tpdeny:
    description: Deny a teleport request or open incoming requests
    usage: /tpdeny [player]
  tpcancel:
    description: Open and cancel your outgoing teleport request
    usage: /tpcancel
    aliases: [tpacancel]
  setspawn:
    description: Sets the server spawn
    usage: /setspawn
    permission: Admin.Core
  settings:
    description: Opens your personal player settings
    usage: /settings
  team:
    description: Team management and shared team storage
    usage: /team [chat|admin]
    aliases: [tc]
  lwg:
    description: Native LifestealCore region protection manager
    usage: /lwg [pos1|pos2|create|admin|delete|addmember|removemember|flag|priority|parent]
  blocklog:
    description: Block history lookup and region rollback
    usage: /blocklog preview <region> <minutes> [player] | /blocklog rollback confirm
    permission: Admin.Core
  msg:
    description: Send a private message to a player
    usage: /msg <player> <message>
    aliases: [tell, w, whisper]
  reply:
    description: Reply to the last private message
    usage: /r <message>
    aliases: [r]
  ping:
    description: View your ping or another player's ping
    usage: /ping [player]
  chat:
    description: Chat moderation tools
    usage: /chat clear

permissions:
  Owner.Core:
    description: Owner-only access to server management and critical operations
    default: op
  Admin.Core:
    description: Admin commands, shop editor, economy administration, ranks
    default: op
  Support.Core:
    description: Support commands (tp, support mode, requests)
    default: op
  Combat.AltBypass:
    description: Exempt from the same-IP check for hearts
    default: op
  bounty.use:
    description: Use the bounty menu and place bounties
    default: true
  bounty.bypass.cooldown:
    description: No cooldown when placing bounties
    default: op
  bounty.exempt:
    description: No bounty can be placed on this player
    default: op

  Mod.Core:
    description: Moderation and godmode commands
    default: op
