name: Build LifestealCore

on:
  push:
    branches: [main]
    paths-ignore:
      - 'releases/LifestealCore.jar'
      - 'releases/LifestealCore-*.jar'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lifestealcore-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: LifestealCore/pom.xml

      - name: Build with Maven
        run: mvn -B -f LifestealCore/pom.xml clean package

      - name: Prepare ZIP packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/LifestealCore
          PLUGIN_JAR="$(find LifestealCore/target -maxdepth 1 -type f -name 'LifestealCore-*.jar' ! -name 'original-*' -print -quit)"
          test -n "$PLUGIN_JAR"
          cp "$PLUGIN_JAR" dist/LifestealCore/
          cp LifestealCore/ANLEITUNG.md dist/LifestealCore/ 2>/dev/null || true
          cp LifestealCore/LEON_DIAGNOSTICS_README.md dist/LifestealCore/ 2>/dev/null || true
          cp -R LifestealCore/src dist/LifestealCore/src
          cp LifestealCore/pom.xml dist/LifestealCore/
          (cd dist && zip -qr LifestealCore-Complete.zip LifestealCore)
          cp "$PLUGIN_JAR" dist/LifestealCore-Plugin.jar
          JAR_NAME="$(basename "$PLUGIN_JAR")"
          echo "Built versioned JAR: $JAR_NAME"

      - name: Publish plugin JAR to repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases
          JAR_NAME="$(basename "$(find LifestealCore/target -maxdepth 1 -type f -name 'LifestealCore-*.jar' ! -name 'original-*' -print -quit)")"
          test -n "$JAR_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Rebase publication onto newest main, then publish the artifact from this run.
          git fetch origin main
          git reset --hard origin/main
          cp dist/LifestealCore-Plugin.jar "releases/$JAR_NAME"
          git add "releases/$JAR_NAME"
          if ! git diff --cached --quiet; then
            git commit -m "Publish LifestealCore $JAR_NAME"
            git push origin HEAD:main
          fi

      - name: Upload plugin and source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LifestealCore-Java25
          path: |
            dist/LifestealCore-Complete.zip
            dist/LifestealCore-Plugin.jar
          if-no-files-found: error
          retention-days: 30
