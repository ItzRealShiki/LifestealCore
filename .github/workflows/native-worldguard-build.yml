name: Native WorldGuard build

on:
  push:
    branches:
      - feature/native-worldedit-worldguard-phase-1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build LifestealCore
        run: mvn -B -f LifestealCore/pom.xml clean package
      - name: Upload plugin JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LifestealCore-native-worldguard
          path: LifestealCore/target/LifestealCore-*.jar
          if-no-files-found: error
