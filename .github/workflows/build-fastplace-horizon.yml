name: Build FastPlace Horizon

on:
  push:
    paths:
      - "FastPlace-Horizon/**"
      - ".github/workflows/build-fastplace-horizon.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python package script
        run: python -m py_compile FastPlace-Horizon/package.py
      - name: Test shared state logic
        run: |
          cd FastPlace-Horizon
          rustup toolchain install 1.95.0 --profile minimal
          cargo +1.95.0 test --lib
      - name: Package Horizon native mod
        run: python FastPlace-Horizon/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: FastPlace-Horizon-26.3
          path: FastPlace-Horizon/dist/fastplace-1.0.0.hnmod
          if-no-files-found: error
