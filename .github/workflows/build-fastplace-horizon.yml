name: Build FastPlace Horizon

on:
  push:
    paths:
      - "FastPlace-Horizon/**"
      - ".github/workflows/build-fastplace-horizon.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python package script
        run: python -m py_compile FastPlace-Horizon/package.py
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: Test shared state logic
        run: |
          cd FastPlace-Horizon
          cargo test --lib
      - name: Package Horizon native mod
        run: python FastPlace-Horizon/package.py
      - name: Checkout pinned Horizon and Mixins sources
        env:
          HORIZON_REVISION: 36eb98b6f6ec4f22649cbe65bbfd32bc0dc2083f
          MIXINS_REVISION: d9c83d7096b7ea5b83678da2efdfd6161f74997e
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/horizon-rust/horizon.git ../horizon
          git -C ../horizon fetch --depth=1 origin "$HORIZON_REVISION"
          git -C ../horizon checkout --detach "$HORIZON_REVISION"
          git clone --filter=blob:none --no-checkout https://github.com/horizon-rust/horizon-mixins.git ../horizon-mixins
          git -C ../horizon-mixins fetch --depth=1 origin "$MIXINS_REVISION"
          git -C ../horizon-mixins checkout --detach "$MIXINS_REVISION"
      - name: Validate real Horizon mixin targets
        run: |
          cargo fetch --locked --manifest-path ../horizon-mixins/Cargo.toml
          cd FastPlace-Horizon
          HORIZON_MIXINS=../../horizon-mixins python tools/horizon.py stage --horizon ../../horizon
      - name: Fetch pinned Horizon build dependencies
        run: cargo fetch --locked --manifest-path ../horizon/Cargo.toml
      - name: Compile injected mod against Horizon
        run: |
          cd FastPlace-Horizon
          HORIZON_MIXINS=../../horizon-mixins python tools/horizon.py check --horizon ../../horizon
      - uses: actions/upload-artifact@v4
        with:
          name: FastPlace-Horizon-26.3
          path: FastPlace-Horizon/dist/fastplace-1.0.0.hnmod
          if-no-files-found: error
