name: Export LifestealCore source
on:
  push:
    branches:
      - chatgpt/export-work
permissions:
  contents: read
  actions: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: zip -r LifestealCore-source.zip LifestealCore
      - uses: actions/upload-artifact@v4
        with:
          name: LifestealCore-source
          path: LifestealCore-source.zip
          retention-days: 1
