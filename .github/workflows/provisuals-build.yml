name: ProVisuals Build

on:
  push:
    paths:
      - 'ProVisuals/**'
      - '.github/workflows/provisuals-build.yml'
  pull_request:
    paths:
      - 'ProVisuals/**'
      - '.github/workflows/provisuals-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ProVisuals (Minecraft 26.2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Build mod
        run: gradle -p ProVisuals clean build --no-daemon --no-configuration-cache

      - name: Upload ProVisuals JAR
        uses: actions/upload-artifact@v4
        with:
          name: ProVisuals-Minecraft-26.2
          path: ProVisuals/build/libs/*.jar
          if-no-files-found: error
