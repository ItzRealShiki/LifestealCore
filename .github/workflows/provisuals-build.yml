name: Build ProVisuals Mod

on:
  push:
    branches:
      - feature/survival-client-config-ui
    paths:
      - 'SurvivalClient/**'
      - '.github/workflows/provisuals-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provisuals-build
  cancel-in-progress: true

jobs:
  build:
    name: Compile ProVisuals (Minecraft 26.2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Build mod
        run: gradle -p SurvivalClient clean build --no-daemon --no-configuration-cache

      - name: Upload mod JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ProVisuals-Minecraft-26.2
          path: |
            SurvivalClient/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
