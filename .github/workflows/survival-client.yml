name: Survival Client Build

on:
  push:
    branches:
      - feature/survival-client-config-ui
    paths:
      - 'SurvivalClient/**'
      - '.github/workflows/survival-client.yml'
  pull_request:
    paths:
      - 'SurvivalClient/**'
      - '.github/workflows/survival-client.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build mod
        working-directory: SurvivalClient
        run: gradle build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: SurvivalClient-26.2
          path: SurvivalClient/build/libs/*.jar
          if-no-files-found: error
