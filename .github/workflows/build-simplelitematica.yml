name: Build SimpleLitematica

on:
  push:
    branches: [ "feature/simplelitematica" ]
    paths:
      - "SimpleLitematica/**"
      - ".github/workflows/build-simplelitematica.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.0"
      - name: Build mod
        working-directory: SimpleLitematica
        run: gradle build --no-daemon
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLitematica-JAR
          path: SimpleLitematica/build/libs/*.jar
          if-no-files-found: error
