name: Publish LifestealCore Release

on:
  workflow_run:
    workflows: ["Build LifestealCore"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source used by the build
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download successful build artifact
        uses: actions/download-artifact@v4
        with:
          name: LifestealCore-Java25
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: artifacts

      - name: Prepare release asset and version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c "import re; print(re.search(r'<version>([^<]+)</version>', open('LifestealCore/pom.xml').read()).group(1))")"
          test -n "$VERSION"
          test -f artifacts/LifestealCore-Plugin.jar
          mkdir -p dist
          ASSET="LifestealCore-$VERSION.jar"
          cp artifacts/LifestealCore-Plugin.jar "dist/$ASSET"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release.outputs.version }}
          name: LifestealCore v${{ steps.release.outputs.version }}
          body: Automated LifestealCore build. The attached JAR is built from the matching repository commit.
          files: dist/${{ steps.release.outputs.asset }}
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
