name: Build Server Manager Windows App

on:
  push:
    branches: [feature/server-manager-app]
    paths:
      - "Server-Manager/**"
      - ".github/workflows/server-manager.yml"
  pull_request:
    paths:
      - "Server-Manager/**"
      - ".github/workflows/server-manager.yml"

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Server-Manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm install
      - name: Build Windows installers
        run: npm run tauri build
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: Server-Manager-Windows
          path: |
            Server-Manager/src-tauri/target/release/bundle/nsis/*.exe
            Server-Manager/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
