name: Build FastPlace Fabric Mod

on:
  push:
    branches: [main]
    paths:
      - 'FastPlace-Fabric/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build mod
        working-directory: FastPlace-Fabric
        run: gradle --no-daemon clean build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: FastPlace-Fabric-26.2
          path: FastPlace-Fabric/build/libs/fastplace-fabric-*.jar
          if-no-files-found: error
          retention-days: 30
